# Grafana dashboard provider: load every dashboard JSON found under
# /var/lib/grafana/dashboards (docker-compose mounts
# observability/grafana/dashboards there).

apiVersion: 1

providers:
  - name: credbroker
    orgId: 1
    folder: CredBroker
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
