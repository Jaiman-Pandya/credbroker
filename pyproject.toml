[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credbroker"
version = "0.1.0"
description = "Scoped credential broker for MCP tool calls: agents get short-lived grants, never raw credentials"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "boto3>=1.34",
    "PyJWT[crypto]>=2.8",
    "grpcio>=1.66",
    "protobuf>=5.26",
    "redis>=5.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "fakeredis>=2.23",
    "respx>=0.21",
    "grpcio-tools>=1.66",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["credbroker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["credbroker/proto/*_pb2.py", "credbroker/proto/*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
